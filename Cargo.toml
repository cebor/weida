[workspace]
resolver = "3"
members = [
    # weida itself: the protocol, its runtime and its shared plumbing.
    "crates/core",
    "crates/protocol",
    "crates/runtime",
    "crates/weida",
    # One directory per foreign protocol family, codec and library and bridge
    # together, because everything belonging to one protocol belongs together
    # (0013 §4.1).
    "crates/zmq/weida-zmtp",
    "crates/zmq/weida-zmq",
    "crates/zmq/weida-zmq-bridge",
    "crates/nng/weida-sp",
    "crates/nng/weida-nng",
    "crates/nng/weida-nng-bridge",
    # The shared PyO3 foundation every Python binding sits on, with nothing
    # protocol-specific in it (0014 §2).
    "crates/py/weida-py-core",
    # Belongs to no single family: one protocol in, another out.
    "crates/interop/cross-tests",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
weida-core = { path = "crates/core", version = "0.1.0" }
weida-protocol = { path = "crates/protocol", version = "0.1.0" }
weida-runtime = { path = "crates/runtime", version = "0.1.0" }
weida = { path = "crates/weida", version = "0.1.0" }
weida-zmtp = { path = "crates/zmq/weida-zmtp", version = "0.1.0" }
weida-zmq = { path = "crates/zmq/weida-zmq", version = "0.1.0" }
weida-sp = { path = "crates/nng/weida-sp", version = "0.1.0" }
weida-nng = { path = "crates/nng/weida-nng", version = "0.1.0" }
weida-py-core = { path = "crates/py/weida-py-core", version = "0.1.0" }

quinn = "0.11"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "io-util",
    "time",
    "net",
] }
bytes = "1"
# The caller's executor need not be tokio: transfers implement both trait
# families, and the `futures` dev-dependency drives the no-tokio test.
futures-io = "0.3"
futures = "0.3"
tracing = "0.1"
rand = "0.9"
minicbor = { version = "2", features = ["alloc"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
ring = "0.17"
# The one cryptographic dependency of `weida-zmq`, for CURVE. RustCrypto's
# NaCl-compatible `crypto_box`: X25519 key agreement, HSalsa20 to derive the
# shared key, XSalsa20-Poly1305 for the box - which is exactly the
# construction 26/CURVEZMQ is specified in terms of, rather than a lookalike,
# so a box this workspace seals opens in libsodium and libzmq. Pure Rust, so
# `unsafe_code = "forbid"` survives it.
crypto_box = "0.9"
# The Python bindings' one foreign dependency: CPython through PyO3.
# `abi3-py39` is the limited API, so one wheel covers every CPython from 3.9
# on, which is what B-118's registry metadata promises. The bindings hold this
# version in common because two PyO3 versions in one interpreter cannot share a
# type object.
pyo3 = { version = "0.29", features = ["abi3-py39"] }

rcgen = "0.14"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
criterion = { version = "0.8", features = ["async_tokio"] }
# The foreign peer for the ZMTP interop bench and tests: a pure-Rust ZeroMQ that
# shares no code and no assumptions with our codec, which is the only thing that
# turns "we agree with ourselves" into interoperability
# (`docs/adapters/zmtp.md` §10 item 3). Tests and benches only.
zeromq = "0.6"
# Proves a negative the type system holds and no runtime test can see: a
# socket shared between threads must not compile (B-102). Tests only.
trybuild = "1"
