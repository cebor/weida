[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/protocol",
    "crates/runtime",
    "crates/weida",
    "crates/zmq/weida-zmq",
    "crates/adapters/weida-zmtp",
    "crates/adapters/weida-zmtp-bridge",
    "crates/adapters/weida-sp",
    "crates/adapters/weida-sp-bridge",
    "crates/adapters/cross-tests",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
weida-core = { path = "crates/core", version = "0.1.0" }
weida-protocol = { path = "crates/protocol", version = "0.1.0" }
weida-runtime = { path = "crates/runtime", version = "0.1.0" }
weida = { path = "crates/weida", version = "0.1.0" }
weida-zmtp = { path = "crates/adapters/weida-zmtp", version = "0.1.0" }
weida-zmq = { path = "crates/zmq/weida-zmq", version = "0.1.0" }
weida-sp = { path = "crates/adapters/weida-sp", version = "0.1.0" }

quinn = "0.11"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "io-util",
    "time",
    "net",
] }
bytes = "1"
# The caller's executor need not be tokio: transfers implement both trait
# families, and the `futures` dev-dependency drives the no-tokio test.
futures-io = "0.3"
futures = "0.3"
tracing = "0.1"
rand = "0.9"
minicbor = { version = "2", features = ["alloc"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
ring = "0.17"

rcgen = "0.14"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
criterion = { version = "0.8", features = ["async_tokio"] }
# The foreign peer for the ZMTP interop bench and tests: a pure-Rust ZeroMQ that
# shares no code and no assumptions with our codec, which is the only thing that
# turns "we agree with ourselves" into interoperability
# (`docs/adapters/zmtp.md` §10 item 3). Tests and benches only.
zeromq = "0.6"
