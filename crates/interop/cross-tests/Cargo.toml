[package]
name = "weida-cross-tests"
description = "Cross-adapter tests: one message, two foreign protocols, weida in the middle"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# No library code, deliberately. This crate exists so that the two adapters
# can be tested *together* without either adapter crate depending on the
# other: `weida-zmq-bridge` and `weida-nng-bridge` know nothing of each other,
# and a chain that runs through both belongs to neither
# (`docs/ARCHITECTURE.md` §4, `docs/LOOP.md` §9 Phase B slice 6).
[dependencies]

[dev-dependencies]
weida.workspace = true
weida-zmtp.workspace = true
weida-zmq-bridge = { path = "../../zmq/weida-zmq-bridge" }
weida-sp.workspace = true
weida-nng-bridge = { path = "../../nng/weida-nng-bridge" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
tracing-subscriber.workspace = true
# Both foreign ends are the real implementations, which is what makes a
# disagreement an interoperability bug rather than a tautology: `zeromq` is
# pure Rust (`docs/adapters/zmtp.md` §10) and `nng` builds the C library the
# SP mapping document could find no pure-Rust alternative to
# (`docs/adapters/nng.md` §10).
zeromq.workspace = true
nng = "1.0"
# `ZmqMessage` frames are `bytes::Bytes`, so a multipart message in a test has
# to be built from them.
bytes.workspace = true

[lints.rust]
unsafe_code = "forbid"
