[package]
name = "weida-nng"
description = "An implementation of the nanomsg Scalability Protocols in Rust: sockets, endpoints and pipes, usable with no weida in the picture"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# The machine room only: the reactor, the resolver, the AF_UNIX hygiene and
# the name registry, plus one OS-error vocabulary at the boundary. `weida` and
# `weida-protocol` MUST NOT appear here
# (`docs/decisions/0013-competitor-libraries.md` §4.2).
weida-core.workspace = true
weida-runtime.workspace = true
tokio.workspace = true
# The sans-I/O SP codec: the 8-octet protocol header, the 64-bit framing, the
# REQ/SURVEY tag stack and the PAIR v1 hop count, with the declared-length
# check that makes `NNG_OPT_RECVMAXSZ` enforceable before a body is
# allocated. Reused rather than reimplemented; its own manifest stays empty
# (0013 §4.3).
weida-sp.workspace = true
# Connection lifecycle logging: a reconnect loop that says nothing is a
# reconnect loop nobody can debug.
tracing.workspace = true
# The `tls+tcp` transport, and the only cryptographic dependency this crate
# has. `rustls` through `tokio-rustls` is a pure-Rust TLS implementation, so
# `unsafe_code = "forbid"` below survives it and no OpenSSL is linked;
# `rustls-webpki` is the path validator behind it and is read directly for
# the peer's subject alternative names, which is what NNG exposes as
# `NNG_OPT_TLS_PEER_ALT_NAMES`. Both are already in this workspace for
# weida's own QUIC transport, so `tls+tcp` adds one node to `cargo tree`
# rather than a new cryptographic stack.
tokio-rustls.workspace = true
rustls-webpki.workspace = true
# NNG itself, for B-133's interop tests — the reference implementation this
# library is measured against, reached through the `nng` crate's bindings
# over `nng-sys`, which builds the C library from vendored sources.
#
# **Optional and off**, and in `[dependencies]` rather than beside the
# other test-only crates because cargo forbids an optional
# dev-dependency. Building NNG must not be a condition of building this
# crate's tests: a machine with no C toolchain builds and tests everything
# else. Turn it on with `--features nng-interop`; the tests are
# `#[ignore]`d on top of that, so `--ignored` is the deliberate step that
# runs them.
nng = { version = "1.0", optional = true }

[dev-dependencies]
# Drives the owned-context doctest and tests from an executor that is not
# tokio, which is what `Context::owned` exists for.
futures.workspace = true
# Proves the negatives no runtime test can see: a PUSH socket has no
# receive and a PULL socket has no send, which is NNG's rule about
# direction and only a compiler can assert an absent method. Tests only.
trybuild.workspace = true
# Certificates for the `tls+tcp` tests: a CA and one identity signed by
# it, generated in the test rather than committed, so nothing expires and
# no private key lives in the repository. Tests only.
rcgen.workspace = true

[features]
# The NNG interop tests. Off by default because the C library is a build
# condition, not a runtime one: with this on and no cmake or compiler
# present, nothing links.
nng-interop = ["dep:nng"]

[lints.rust]
unsafe_code = "forbid"
