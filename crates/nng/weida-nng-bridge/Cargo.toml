[package]
name = "weida-nng-bridge"
description = "Bridges foreign nanomsg/NNG SP peers onto weida endpoints, terminating both protocols"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

# A separate crate from `weida-sp` on purpose: that one depends on nothing at
# all, which is what lets its codec be checked against the SP RFCs rather than
# against weida's reading of them (`docs/ARCHITECTURE.md` §4). A bridge is the
# other half - it necessarily depends on both sides - so it gets its own crate
# instead of a feature that would put a weida dependency in the codec's
# manifest.
[dependencies]
weida.workspace = true
weida-sp.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "macros", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
# So a failing test can show why a bridged connection ended: the bridge logs
# that through `tracing` and a test with `--nocapture` prints it.
tracing-subscriber.workspace = true

[lints.rust]
unsafe_code = "forbid"
