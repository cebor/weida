[package]
name = "weida-nng-bridge"
description = "Bridges foreign nanomsg/NNG SP peers onto weida endpoints, terminating both protocols"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

# A forwarder necessarily depends on both sides: `weida` for the patterns
# and `weida-nng` for the SP sockets. It depends on `weida-sp` too, but only
# for the tag stack and the endpoint-type names its configuration surface
# speaks in - the parsing is the library's
# (`docs/decisions/0013-competitor-libraries.md` §5.2).
[dependencies]
weida.workspace = true
weida-nng.workspace = true
weida-sp.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "macros", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
# So a failing test can show why a bridged connection ended: the bridge logs
# that through `tracing` and a test with `--nocapture` prints it.
tracing-subscriber.workspace = true

[lints.rust]
unsafe_code = "forbid"
