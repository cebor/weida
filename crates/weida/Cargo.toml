[package]
name = "weida"
description = "QUIC-native messaging framework: runtime, native QUIC transport, Req/Rep, Push/Pull and Pub/Sub"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
weida-core.workspace = true
weida-protocol.workspace = true
quinn.workspace = true
tokio.workspace = true
bytes.workspace = true
tracing.workspace = true
rand.workspace = true
rustls-pki-types.workspace = true

[dev-dependencies]
rcgen.workspace = true
tracing-subscriber.workspace = true
# Examples stream stdin/stdout; the library itself needs no stdio.
tokio = { workspace = true, features = ["io-std"] }
criterion.workspace = true

[[bench]]
name = "echo"
harness = false

[[bench]]
name = "patterns"
harness = false

[lints.rust]
unsafe_code = "forbid"
