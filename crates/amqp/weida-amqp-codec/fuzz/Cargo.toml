[package]
name = "weida-amqp-codec-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
# Its own workspace (see below), so nothing to inherit; unpublished, so the
# manifest needs no registry metadata.
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
weida-amqp-codec = { path = ".." }

# Deliberately its own workspace: the fuzz crate needs nightly and must not
# affect `cargo build --workspace` or the lockfile of the library crates.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "value"
path = "fuzz_targets/value.rs"
test = false
doc = false
bench = false

[[bin]]
name = "composite"
path = "fuzz_targets/composite.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "performative"
path = "fuzz_targets/performative.rs"
test = false
doc = false
bench = false
