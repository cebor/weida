[package]
name = "weida-winpipe"
description = "The Win32 calls a named-pipe transport needs and nothing else: an owner-only DACL, the client's token SID, the pipe's owner SID, both process ids"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

# Empty on every platform but Windows: the crate exists so that the one
# place this workspace has to call Win32 is a crate that does nothing else
# (`docs/ARCHITECTURE.md` §4). Every other crate keeps
# `unsafe_code = "forbid"`.
[dependencies]

[target.'cfg(windows)'.dependencies]
# The named-pipe handles this crate reads are tokio's, so that a consumer
# holds one type and never a raw handle.
tokio.workspace = true
# Raw bindings, not the `windows` crate: this crate needs fifteen functions,
# and the bindings crate is already in the tree through `mio`.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints.rust]
# The exception, and the only one: every `unsafe` block here wraps one Win32
# call and states what it relies on. `unsafe_op_in_unsafe_fn` keeps a block
# from hiding inside an `unsafe fn`.
unsafe_op_in_unsafe_fn = "forbid"
