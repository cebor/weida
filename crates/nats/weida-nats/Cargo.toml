[package]
name = "weida-nats"
description = "A NATS core client in Rust: connections, subscriptions, queue groups and request-reply, usable with no weida in the picture"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# The machine room only: the reactor, the resolver and the close budget, plus
# one OS-error vocabulary at the boundary. `weida` and `weida-protocol` MUST
# NOT appear here (`docs/decisions/0013-competitor-libraries.md` §4.2).
weida-core.workspace = true
weida-runtime.workspace = true
tokio.workspace = true
# The sans-I/O NATS text-protocol codec: the twelve verbs, the `NATS/1.0`
# header block and the declared-count discipline that keeps a payload from
# ever being scanned for a terminator. Reused rather than reimplemented; its
# own manifest stays empty (0013 §4.3).
weida-nats-codec.workspace = true
# Connection lifecycle logging: a reconnect loop that says nothing is a
# reconnect loop nobody can debug.
tracing.workspace = true
# TLS, on by default. `INFO.tls_required` makes it the server's decision
# rather than the client's, so a client that cannot do it is a client that
# cannot connect to a large share of deployments.
tokio-rustls = { workspace = true, optional = true }

[dev-dependencies]
# A certificate for the TLS tests. The trust anchors are the caller's
# everywhere else; here the test is the caller.
rcgen.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "time",
    "sync",
] }

[features]
default = ["tls"]
# TLS completed before ordinary traffic where `INFO` requires it.
tls = ["dep:tokio-rustls"]

[lints.rust]
unsafe_code = "forbid"
