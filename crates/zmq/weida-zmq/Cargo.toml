[package]
name = "weida-zmq"
description = "A ZeroMQ implementation in Rust: contexts, sockets and endpoints, usable with no weida in the picture"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# The machine room only: the reactor, the resolver, the AF_UNIX hygiene and
# the name registry, plus one OS-error vocabulary at the boundary. `weida` and
# `weida-protocol` MUST NOT appear here
# (`docs/decisions/0013-competitor-libraries.md` §4.2).
weida-core.workspace = true
weida-runtime.workspace = true
tokio.workspace = true
# The sans-I/O ZMTP codec: the greeting, the flags octet and the size field,
# with the declared-length check that makes ZMQ_MAXMSGSIZE enforceable before
# a body is allocated. Reused rather than reimplemented; its own manifest
# stays empty (0013 §4.3).
weida-zmtp.workspace = true
# Connection lifecycle logging: a reconnect loop that says nothing is a
# reconnect loop nobody can debug.
tracing.workspace = true
# CURVE's cryptography, and the only cryptographic dependency this crate has:
# `crypto_box` **is** NaCl's `crypto_box`, which is the construction
# 26/CURVEZMQ is written in terms of. The layouts stay in `weida-zmtp`, whose
# own manifest is still empty, and `unsafe_code = "forbid"` below survives
# this because the crate is pure Rust.
crypto_box.workspace = true
# The executor the blocking facade drives its futures on, and only that: the
# reactor's own threads are busy driving the connections, so a blocking caller
# polls the socket's future on the thread that asked. `weida-runtime`'s Exec
# promises exactly this ("the caller may drive the returned futures on any
# executor - futures::executor::block_on included"); the `blocking` feature is
# that promise taken up. Optional, so a caller that does not want the facade
# does not link it.
futures = { workspace = true, optional = true }

[dev-dependencies]
# Drives the owned-context doctest and tests from an executor that is not
# tokio, which is what `Context::owned` exists for.
futures.workspace = true
# The compile-fail harness for libzmq's thread rule: a socket is `Send` and
# **not** `Sync`, and the second half only a compiler can assert.
trybuild.workspace = true

[features]
# The synchronous facade, off by default: `weida_zmq::blocking`. Not default
# because a caller that already runs a reactor wants the asynchronous sockets,
# and a feature nobody asked for is a reactor nobody asked for
# (`ContextConfig::worker_threads` threads, owned by the context).
blocking = ["dep:futures"]

[[example]]
# The zguide's Hello World, in the shape its C original has.
name = "hello_world"
required-features = ["blocking"]

[lints.rust]
unsafe_code = "forbid"
