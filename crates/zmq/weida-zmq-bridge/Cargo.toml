[package]
name = "weida-zmq-bridge"
description = "Bridges foreign ZeroMQ peers onto weida endpoints, terminating both protocols"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

# A separate crate from `weida-zmtp` on purpose: that one depends on nothing at
# all, which is what lets its codec be checked against 37/ZMTP rather than
# against weida's reading of it (`docs/ARCHITECTURE.md` §4). A bridge is the
# other half — it necessarily depends on both sides — so it gets its own crate
# instead of a feature that would put a weida dependency in the codec's
# manifest.
[dependencies]
weida.workspace = true
weida-zmq.workspace = true
# Still here, and only for the socket-type table the tests pin and the
# metadata names: the framing and the handshake are `weida-zmq`'s now.
weida-zmtp.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
# So a failing test can show why a bridged connection ended: the bridge logs
# that through `tracing` and a test with `--nocapture` prints it.
tracing-subscriber.workspace = true
# The independent ZeroMQ implementation the interop tests and the bench run
# against: `docs/adapters/zmtp.md` §10 item 3 is explicit that a peer built on
# our own codec is faithful and *not* independent, so this is what settles it.
zeromq.workspace = true
criterion.workspace = true
# `ZmqMessage` frames are `bytes::Bytes`, so a multipart message in a test has
# to be built from them.
bytes.workspace = true

[[bench]]
name = "interop"
harness = false

[lints.rust]
unsafe_code = "forbid"
