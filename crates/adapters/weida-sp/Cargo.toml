[package]
name = "weida-sp"
description = "nanomsg/NNG Scalability Protocols (SP v1) codec: TCP protocol header, message framing and the per-protocol headers, sans-I/O"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

# No dependencies, deliberately: not even weida-core. The codec is the half of
# the adapter that can be tested byte-for-byte against a foreign specification,
# so it must not be able to reach for weida's types, its limits or its error
# vocabulary. The bridge slices depend on both sides; this one depends on
# neither (`docs/adapters/nng.md` §1, ARCHITECTURE.md §4).
[dependencies]

[lints.rust]
unsafe_code = "forbid"
