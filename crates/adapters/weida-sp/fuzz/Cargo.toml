[package]
name = "weida-sp-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
weida-sp = { path = ".." }

# Deliberately its own workspace: the fuzz crate needs nightly and must not
# affect `cargo build --workspace` or the lockfile of the library crates.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message_stream"
path = "fuzz_targets/message_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backtrace"
path = "fuzz_targets/backtrace.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pair"
path = "fuzz_targets/pair.rs"
test = false
doc = false
bench = false
