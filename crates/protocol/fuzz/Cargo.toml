[package]
name = "weida-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
# Its own workspace (see below), so nothing to inherit; unpublished, so the
# manifest needs no registry metadata.
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
weida-core = { path = "../../core" }
weida-protocol = { path = ".." }

# Deliberately its own workspace: the fuzz crate needs nightly and must not
# affect `cargo build --workspace` or the lockfile of the library crates.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "preamble"
path = "fuzz_targets/preamble.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_header"
path = "fuzz_targets/data_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hello"
path = "fuzz_targets/hello.rs"
test = false
doc = false
bench = false

[[bin]]
name = "traceparent"
path = "fuzz_targets/traceparent.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
