    <circle cx="229" cy="257.4" r="3"/>
    <circle cx="277" cy="254.6" r="3"/>
    <circle cx="368" cy="239.2" r="3"/>
    <circle cx="432" cy="227.3" r="3"/>
    <circle cx="540" cy="211.2" r="3"/>
    <circle cx="615" cy="162.2" r="3"/>
    <circle cx="763" cy="124.4" r="3"/>
    <circle cx="780" cy="115.3" r="3"/>
    <circle cx="837" cy="84.5" r="3"/>
    <circle cx="864" cy="80.3" r="3"/>
    <circle cx="920" cy="64.2" r="3"/>
  </g>
  <g class="ev">
    <text x="74"  y="250">218 seed</text>
    <text x="200" y="250">03:40 B-010 probe</text>
    <text x="281" y="248">244 filters</text>
    <text x="330" y="232">261 HELLO+detect</text>
    <text x="436" y="220">284 reassembly</text>
    <text x="500" y="204">354 drain+B-017</text>
    <text x="560" y="155">408 AF_UNIX+0012</text>
    <text x="700" y="118">421 reverse pool</text>
    <text x="700" y="140">465 review pass</text>
    <text x="800" y="70">494 stop</text>
