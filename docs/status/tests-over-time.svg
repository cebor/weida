  <text x="843.0" y="139.8" class="ev" text-anchor="end">1481 · NNG bridge on the library (B-134)</text>
  <text x="848.7" y="123.7" class="ev" text-anchor="end">1573 · three AMQP/NATS items (B-165..167)</text>
  <text x="891.5" y="93.4" class="ev" text-anchor="end">1678 · the stop, main 5ca1329</text>
  <text x="20" y="430" class="sub">Every point is a merge into main behind the four-step gate of docs/LOOP.md §6 (fmt, clippy in every configuration, test, doc). No test was weakened or</text>
  <text x="20" y="444" class="sub">ignored to pass, and the two dips are real: B-098 replaced four tests with one, and B-094 deleted the bridge’s own wire layer together with its suite.</text>
  <text x="20" y="458" class="sub">Purple ticks under the axis are review passes (docs/LOOP.md §8): three on day 1, ten on day 2, nine of them inside the parallel run. Source: docs/NIGHTLOG.md.</text>
