<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <style>
      .peer  { fill:#e3f2fd; stroke:#1565c0; stroke-width:1.2; }
      .br    { fill:#c8e6c9; stroke:#2e7d32; stroke-width:1.2; }
      .core  { fill:#fff3cd; stroke:#b28704; stroke-width:1.2; }
      .lbl   { fill:#263238; }
      .sub   { fill:#546e7a; font-size:10px; }
      .title { fill:#263238; font-size:14px; font-weight:bold; }
      .arrow { stroke:#455a64; stroke-width:1.4; fill:none; marker-end:url(#a); }
      .tp    { fill:#c62828; font-size:10px; font-weight:bold; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#455a64"/></marker>
  </defs>
  <text x="20" y="28" class="title">The first message that crosses two protocols (B-057, nine chains, green on branch b057-cross-adapter)</text>

  <rect x="20"  y="70" width="150" height="70" rx="6" class="peer"/>
  <text x="30" y="92" class="lbl">ZeroMQ peer</text><text x="30" y="108" class="sub">zeromq crate, ZMTP 3.0</text><text x="30" y="122" class="sub">REQ · PUSH · PUB</text>

  <rect x="210" y="70" width="170" height="70" rx="6" class="br"/>
  <text x="220" y="92" class="lbl">weida-zmq-bridge</text><text x="220" y="108" class="sub">terminates ZMTP, consumes envelope</text><text x="220" y="122" class="sub">refuses multipart (L1), mid-segment (L2)</text>

  <rect x="420" y="70" width="140" height="70" rx="6" class="core"/>
  <text x="430" y="92" class="lbl">weida runtime</text><text x="430" y="108" class="sub">Replier / Puller / Publisher</text><text x="430" y="122" class="sub">guarantee set: core</text>

  <rect x="600" y="70" width="170" height="70" rx="6" class="br"/>
  <text x="610" y="92" class="lbl">weida-nng-bridge</text><text x="610" y="108" class="sub">raw REQ header, no resend timer</text><text x="610" y="122" class="sub">topic = leading bytes + NUL</text>

  <rect x="810" y="70" width="130" height="70" rx="6" class="peer"/>
  <text x="820" y="92" class="lbl">NNG peer</text><text x="820" y="108" class="sub">nng crate, SP over TCP</text><text x="820" y="122" class="sub">REP · PULL · SUB</text>

  <path d="M170,95 L210,95" class="arrow"/>
  <path d="M380,95 L420,95" class="arrow"/>
  <path d="M560,95 L600,95" class="arrow"/>
  <path d="M770,95 L810,95" class="arrow"/>
  <path d="M810,118 L770,118" class="arrow"/>
  <path d="M600,118 L560,118" class="arrow"/>
  <path d="M420,118 L380,118" class="arrow"/>
  <path d="M210,118 L170,118" class="arrow"/>

  <!-- transfer points -->
  <text x="150" y="168" class="tp">transfer point: zmq_send() returns</text>
  <text x="392" y="168" class="tp">delivered(): next hop's transport</text>
  <text x="700" y="168" class="tp">SP: no transfer point at all</text>
  <line x1="170" y1="150" x2="170" y2="158" stroke="#c62828"/>
  <line x1="490" y1="150" x2="490" y2="158" stroke="#c62828"/>
  <line x1="770" y1="150" x2="770" y2="158" stroke="#c62828"/>

  <rect x="20" y="190" width="920" height="105" rx="6" fill="#fafafa" stroke="#cfd8dc"/>
  <text x="30" y="210" class="lbl">What the tests assert end to end</text>
  <text x="30" y="228" class="sub">• Honest claim is BestEffort: a ZeroMQ send succeeds with the far end closed, and a fresh puller proves nothing arrived (asserted, not commented).</text>
  <text x="30" y="243" class="sub">• Losses compose: a ZMTP multipart is refused at hop one and never reaches hop two; the smaller max_message_bytes decides and the far edge buffers nothing.</text>
  <text x="30" y="258" class="sub">• Envelopes are restored on their own side: ZMTP empty delimiter on the left, SP request-id backtrace on the right; weida carries neither.</text>
  <text x="30" y="273" class="sub">• Every bridge asserts GuaranteeSet::CORE on its edge; ordering holds within one hop only (GUARANTEES §2). Sources: docs/adapters/zmtp.md, docs/adapters/nng.md.</text>
  <text x="30" y="288" class="sub">• Both forwarders now run on the libraries rather than on a second implementation: weida-zmq-bridge on weida-zmq (B-094), weida-nng-bridge on weida-nng (B-134).</text>
</svg>
