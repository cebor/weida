<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <style>
      .done    { fill:#c8e6c9; stroke:#2e7d32; }
      .partial { fill:#fff3cd; stroke:#b28704; }
      .ready   { fill:#eceff1; stroke:#607d8b; }
      .blocked { fill:#ffcdd2; stroke:#c62828; }
      .todo    { fill:#ffffff; stroke:#90a4ae; stroke-dasharray:4 3; }
      .parked  { fill:#e1bee7; stroke:#6a1b9a; }
      .lbl     { fill:#263238; }
      .sub     { fill:#546e7a; font-size:10px; }
      .phase   { fill:#263238; font-size:14px; font-weight:bold; }
    </style>
  </defs>
  <text x="20" y="28" class="phase">Roadmap — main fa13dbb · 1882 passed</text>

  <!-- legend -->
  <g transform="translate(500,14)">
    <rect x="0" y="0" width="14" height="14" class="done"/><text x="18" y="11" class="lbl">done</text>
    <rect x="60" y="0" width="14" height="14" class="partial"/><text x="78" y="11" class="lbl">partial</text>
    <rect x="130" y="0" width="14" height="14" class="ready"/><text x="148" y="11" class="lbl">ready</text>
    <rect x="195" y="0" width="14" height="14" class="blocked"/><text x="213" y="11" class="lbl">blocked</text>
    <rect x="270" y="0" width="14" height="14" class="parked"/><text x="288" y="11" class="lbl">parked</text>
    <rect x="335" y="0" width="14" height="14" class="todo"/><text x="353" y="11" class="lbl">not started</text>
  </g>

  <!-- Phase A -->
  <text x="20" y="66" class="phase">Phase A — the decided spec, realized</text>
  <g transform="translate(20,76)">
    <rect x="0"   y="0" width="96" height="46" rx="4" class="done"/>   <text x="8" y="18" class="lbl">A1 decisions</text><text x="8" y="34" class="sub">0004–0008</text>
    <rect x="102" y="0" width="96" height="46" rx="4" class="done"/>   <text x="110" y="18" class="lbl">A2 spec sync</text><text x="110" y="34" class="sub">5 documents</text>
    <rect x="204" y="0" width="96" height="46" rx="4" class="done"/>   <text x="212" y="18" class="lbl">A3 measures</text><text x="212" y="34" class="sub">header · reorder</text>
    <rect x="306" y="0" width="96" height="46" rx="4" class="done"/>   <text x="314" y="18" class="lbl">A4 wire</text><text x="314" y="34" class="sub">keys 6/7, HELLO</text>
    <rect x="408" y="0" width="96" height="46" rx="4" class="done"/><text x="416" y="18" class="lbl">A5 conn tiers</text><text x="416" y="34" class="sub">per path (0011)</text>
    <rect x="510" y="0" width="96" height="46" rx="4" class="done"/>   <text x="518" y="18" class="lbl">A6 reassembly</text><text x="518" y="34" class="sub">capped hold</text>
    <rect x="612" y="0" width="96" height="46" rx="4" class="done"/>   <text x="620" y="18" class="lbl">A7 topic filters</text><text x="620" y="34" class="sub">segmented * #</text>
    <rect x="714" y="0" width="96" height="46" rx="4" class="done"/>   <text x="722" y="18" class="lbl">A8 runtime</text><text x="722" y="34" class="sub">owned reactor</text>
    <rect x="816" y="0" width="120" height="46" rx="4" class="done"/><text x="824" y="18" class="lbl">A9 transports</text><text x="824" y="31" class="sub">inproc ✓ unix ✓</text><text x="824" y="42" class="sub">pipes ✓ (B-039)</text>
  </g>

  <!-- what Phase A still owes, in the colour the legend promises -->
  <g transform="translate(20,128)">
    <rect x="0" y="0" width="430" height="18" rx="3" class="done"/><text x="8" y="13" class="sub">Phase A complete — pipes landed under Linux + Windows gates (B-039)</text>
    <rect x="440" y="0" width="430" height="18" rx="3" class="parked"/><text x="448" y="13" class="sub">A5 control connection parked by 0011 §4.3, with a revival condition</text>
  </g>

  <!-- Phase B -->
  <text x="20" y="160" class="phase">Phase B — the competitor libraries and their bindings (0013 §4.7's six clauses)</text>
  <g transform="translate(20,170)">
    <rect x="0"   y="0" width="220" height="58" rx="4" class="done"/>
    <text x="8" y="18" class="lbl">B1 ZMTP 3.1</text><text x="8" y="34" class="sub">library + forwarder + binding</text><text x="8" y="48" class="sub">vs libzmq 4.3.5; B-070..B-118</text>
    <rect x="228" y="0" width="220" height="58" rx="4" class="done"/>
    <text x="236" y="18" class="lbl">B2 NNG / SP</text><text x="236" y="34" class="sub">library + forwarder rebuilt on it</text><text x="236" y="48" class="sub">vs NNG 1.4.0-rc.0; B-119..B-138</text>
    <rect x="456" y="0" width="220" height="58" rx="4" class="done"/>
    <text x="464" y="18" class="lbl">B3 MQTT 5</text><text x="464" y="34" class="sub">client + binding; server is Phase D</text><text x="464" y="48" class="sub">vs rumqttd + rmqtt; B-139..B-153</text>
    <rect x="684" y="0" width="220" height="58" rx="4" class="done"/>
    <text x="692" y="18" class="lbl">B4 AMQP 1.0, NATS</text><text x="692" y="34" class="sub">two clients + two bindings</text><text x="692" y="48" class="sub">vs fe2o3-amqp; NATS not run; B-154..B-174</text>
  </g>

  <!-- Phase C -->
  <text x="20" y="266" class="phase">Phase C — bindings, in the order fixed by 0030</text>
  <g transform="translate(20,276)">
    <rect x="0" y="0" width="174" height="46" rx="4" class="done"/><text x="8" y="18" class="lbl">Python (PyO3)</text><text x="8" y="34" class="sub">six bindings · async + sync</text>
    <rect x="182" y="0" width="174" height="46" rx="4" class="todo"/><text x="190" y="18" class="lbl">Node / Bun / Deno</text><text x="190" y="34" class="sub">one N-API artifact · next</text>
    <rect x="364" y="0" width="174" height="46" rx="4" class="todo"/><text x="372" y="18" class="lbl">Erlang</text><text x="372" y="34" class="sub">Rustler · mailbox completion</text>
    <rect x="546" y="0" width="174" height="46" rx="4" class="todo"/><text x="554" y="18" class="lbl">C ABI</text><text x="554" y="34" class="sub">opaque blocking handles</text>
    <rect x="728" y="0" width="176" height="46" rx="4" class="todo"/><text x="736" y="18" class="lbl">Java</text><text x="736" y="34" class="sub">last, not dropped</text>
  </g>

  <!-- Phase D -->
  <text x="20" y="360" class="phase">Phase D — the L2 broker, store and cluster</text>
  <g transform="translate(20,370)">
    <rect x="0" y="0" width="448" height="46" rx="4" class="done"/>
    <text x="8" y="18" class="lbl">Broker core — admit · confirm · credit · settle/requeue</text>
    <text x="8" y="34" class="sub">B-201..203: a sent message stays charged until Processed or requeued</text>
    <rect x="456" y="0" width="448" height="46" rx="4" class="ready"/>
    <text x="464" y="18" class="lbl">Next — attempt · report relay · retire</text>
    <text x="464" y="34" class="sub">B-267..269 ready; store, replication and server halves follow</text>
  </g>

  <!-- the one slice that belongs to no roadmap line -->
  <g transform="translate(20,424)">
    <rect x="0" y="0" width="676" height="18" rx="3" class="done"/><text x="8" y="13" class="sub">Beside the lines: the `weida` CLI — serve/request/send/sub over all three transports, exit codes per error (B-060)</text>
  </g>

  <text x="20" y="456" class="sub">Boxes follow LOOP.md §9; 0030 supersedes its binding order with Python → Node → Erlang → C → Java. Item ids refer to docs/BACKLOG.md.</text>
  <text x="20" y="468" class="sub">A forwarder exists for ZeroMQ and NNG only; 0014 §3.4 files none for MQTT, AMQP or NATS, because a forwarder follows the library it forwards.</text>
</svg>
